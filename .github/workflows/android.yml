name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Privacy gate: this repo is public. It must never name the owner, a real incident, a real TFR or a
      # real unit callsign. The pattern is stored base64-encoded so this file doesn't contain the strings it
      # blocks. Case-insensitive, over every tracked text file, every tracked path and the commit message.
      - name: Forbidden identifying strings
        run: |
          pat="$(echo 'KF58W15kXSlyb2JpbnNvbnxmbG9yaXN0b258KF58W15hLXowLTldKXVyLT9bMC05XXsyfShbXjAtOV18JCl8NlsvXyBdNTAyMXx0YW8tPzQxM3xkb25hbGR8aW5jaWRlbnQtcmVwb3J0cw==' | base64 -d)"
          bad=0
          if git grep -nIiE "$pat" -- .; then bad=1; fi
          if git ls-files | grep -iE "$pat"; then bad=1; fi
          if git log -1 --format=%B | grep -iE "$pat"; then bad=1; fi
          if [ "$bad" = 1 ]; then echo "::error::forbidden identifying string found (see the lines above)"; exit 1; fi
          echo "clean"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK (ANDROID_HOME); make sure the
      # exact platform/build-tools this project pins are present.
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0" > /dev/null

      # No secrets in CI: the APK is built without a baked-in fleet token;
      # the pilot pastes it in Settings (or build locally with secrets.properties).
      - name: Unit tests (engine + demo replay)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flight-deck-sentry-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
